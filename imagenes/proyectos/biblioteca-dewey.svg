<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Pipeline de la biblioteca con signatura Dewey</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="1120" height="720" fill="#f4f4f6"/>

  <!-- Conexiones -->
  <g stroke="#9ca3af" stroke-width="2.5" fill="none">
    <line x1="216" y1="110" x2="357" y2="110"/>
    <line x1="489" y1="110" x2="630" y2="110"/>
    <line x1="762" y1="110" x2="903" y2="110"/>
    <path d="M1035,110 C1095,110 1095,272 1000,272 L150,272 C50,272 50,380 82,380" marker-end="url(#flecha)"/>
    <line x1="216" y1="380" x2="357" y2="380"/>
    <line x1="489" y1="380" x2="630" y2="380"/>
    <line x1="762" y1="380" x2="903" y2="380"/>
  </g>

  <!-- Nodos, fila 1 -->
  <path d="M150,50 H196 Q210,50 210,64 V156 Q210,170 196,170 H150 A60,60 0 0 1 150,50 Z" fill="#fff" stroke="#c4c4cc" stroke-width="2"/>
  <rect x="363" y="50" width="120" height="120" rx="14" fill="#fff" stroke="#c4c4cc" stroke-width="2"/>
  <rect x="636" y="50" width="120" height="120" rx="14" fill="#fff" stroke="#c4c4cc" stroke-width="2"/>
  <rect x="909" y="50" width="120" height="120" rx="14" fill="#fff" stroke="#c4c4cc" stroke-width="2"/>
  <!-- Nodos, fila 2 -->
  <rect x="90" y="320" width="120" height="120" rx="14" fill="#fff" stroke="#c4c4cc" stroke-width="2"/>
  <rect x="363" y="320" width="120" height="120" rx="14" fill="#fff" stroke="#c4c4cc" stroke-width="2"/>
  <rect x="636" y="320" width="120" height="120" rx="14" fill="#fff" stroke="#b9adff" stroke-width="3"/>
  <rect x="909" y="320" width="120" height="120" rx="14" fill="#fff" stroke="#ff8a7a" stroke-width="3"/>

  <!-- Asas: entrada (rectángulo) y salida (círculo) -->
  <g fill="#9ca3af">
    <circle cx="212" cy="110" r="6"/>
    <rect x="356" y="101" width="7" height="18" rx="1.5"/><circle cx="485" cy="110" r="6"/>
    <rect x="629" y="101" width="7" height="18" rx="1.5"/><circle cx="758" cy="110" r="6"/>
    <rect x="902" y="101" width="7" height="18" rx="1.5"/><circle cx="1031" cy="110" r="6"/>
    <rect x="83" y="371" width="7" height="18" rx="1.5"/><circle cx="212" cy="380" r="6"/>
    <rect x="356" y="371" width="7" height="18" rx="1.5"/><circle cx="485" cy="380" r="6"/>
    <rect x="629" y="371" width="7" height="18" rx="1.5"/><circle cx="758" cy="380" r="6"/>
    <rect x="902" y="371" width="7" height="18" rx="1.5"/>
  </g>

  <!-- Iconos -->
  <path d="M138,86 L174,110 L138,134 Z" fill="#ff6d5a"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="700" fill="#fff">
    <rect x="393" y="86" width="60" height="48" rx="7" fill="#27272a"/><text x="404" y="118">&gt;_</text>
    <rect x="666" y="86" width="60" height="48" rx="7" fill="#27272a"/><text x="677" y="118">&gt;_</text>
    <rect x="120" y="356" width="60" height="48" rx="7" fill="#27272a"/><text x="131" y="388">&gt;_</text>
    <rect x="939" y="356" width="60" height="48" rx="7" fill="#27272a"/><text x="950" y="388">&gt;_</text>
  </g>
  <path d="M969,78 C974,103 976,105 1001,110 C976,115 974,117 969,142 C964,117 962,115 937,110 C962,105 964,103 969,78 Z" fill="#d97757"/>
  <circle cx="1022" cy="56" r="17" fill="#d97757"/><text x="1022" y="62" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">×3</text>
  <circle cx="423" cy="380" r="25" fill="none" stroke="#16a34a" stroke-width="5"/>
  <path d="M410,381 L419,390 L437,370" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="680" y="357" width="11" height="46" rx="2" fill="#7b61ff"/><rect x="701" y="357" width="11" height="46" rx="2" fill="#7b61ff"/>

  <!-- Etiquetas -->
  <g font-size="22" font-weight="600" fill="#27272a" text-anchor="middle">
    <text x="150" y="206">Inicio</text>
    <text x="423" y="206">B1 · Explorar</text>
    <text x="696" y="206">B2 · Separar y fichar</text>
    <text x="969" y="206">Clasificar Dewey</text>
    <text x="150" y="476">B3 · Catálogo y plan</text>
    <text x="423" y="476">Control de calidad</text>
    <text x="696" y="476">Esperar aprobación</text>
    <text x="969" y="476">B4 · Mover y renombrar</text>
  </g>
  <g font-size="17" fill="#71717a" text-anchor="middle">
    <text x="423" y="234">inventario de archivos</text>
    <text x="696" y="234">metadatos, ISBN, copias</text>
    <text x="969" y="234">Claude, 3 en paralelo</text>
    <text x="150" y="504">Excel + plan (simulación)</text>
    <text x="423" y="504">repetidos y coherencia</text>
    <text x="696" y="504">revisar el catálogo</text>
    <text x="969" y="504">con registro para deshacer</text>
  </g>

  <!-- Resultado: la carpeta como estante -->
  <rect x="60" y="548" width="1000" height="146" rx="8" fill="#fff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="84" y="584" font-size="18" font-weight="600" fill="#27272a">La carpeta ordenada por nombre es el estante: tema → autor</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#18181b">
    <text x="84" y="618">184_Plato_1997_The-Dialogues-of-Plato-4.pdf</text>
    <text x="84" y="644">193_Vieweg_2020_The-Idealism-of-Freedom.pdf</text>
    <text x="84" y="670">833_Kafka_2009_The-Castle.pdf</text>
  </g>
  <g font-size="17" fill="#52525b">
    <text x="690" y="618">569 archivos en una sola carpeta</text>
    <text x="690" y="644">+ revisar/ (29) y _otros/ (6)</text>
    <text x="690" y="670">0 errores · se puede deshacer</text>
  </g>
</svg>
